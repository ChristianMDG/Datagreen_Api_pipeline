name: Collecte horaire AQI

on:
  schedule:
    - cron: "5 * * * *" 
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecter les données courantes -> raw/
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python src/collect.py

      - name: Reconstruire clean.csv depuis raw/
        run: python src/build_clean.py

      - name: Valider clean.csv
        run: python src/validate_clean.py

      - name: Charger le data warehouse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/load_warehouse.py

      - name: Commit & push raw/ et clean/
        run: |
          git config user.name "aqi-pipeline-bot"
          git config user.email "actions@github.com"
          git add data/raw data/clean
          git diff --quiet --cached || git commit -m "chore: collecte automatique $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
