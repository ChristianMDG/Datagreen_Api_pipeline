name: Collecte horaire AQI

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: datagreen-hourly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-transform-load:
    name: Collecter, transformer et charger les données
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Vérifier les secrets
        shell: bash
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$OWM_API_KEY" ]; then
            echo "::error::Le secret OWM_API_KEY est absent ou vide."
            exit 1
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Le secret DATABASE_URL est absent ou vide."
            exit 1
          fi

          echo "Les secrets nécessaires sont configurés."

      - name: Collecter les données actuelles
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python src/collect.py

      - name: Construire clean.csv
        run: python src/build_clean.py

      - name: Valider les données propres
        run: python src/validate_clean.py

      - name: Charger le data warehouse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/load_warehouse.py

      - name: Committer et pousser les nouvelles données
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw data/clean/clean.csv

          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée à committer."
          else
            git commit -m "data: collecte AQI $(date -u +'%Y-%m-%d %H:%M UTC')"

            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi