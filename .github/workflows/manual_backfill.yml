name: Manual AQI Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datagreen-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill-transform-load:
    name: Backfill, transform, validate, and load data
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$OWM_API_KEY" ]; then
            echo "::error::OWM_API_KEY is missing or empty."
            exit 1
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is missing or empty."
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Collect historical air quality data
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python src/backfill.py --months 12

      - name: Build clean dataset
        run: python src/build_clean.py

      - name: Validate clean dataset
        run: python src/validate_clean.py

      - name: Load data warehouse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/load_warehouse.py

      - name: Commit and push generated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "aqi-pipeline-bot"
          git config user.email "actions@github.com"

          git add data/raw data/clean/clean.csv

          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi

          git commit -m "data: 12-month AQI backfill"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
